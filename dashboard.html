<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Welcome home</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <h2>Zona Asist</h2>
      <article class="keycap" id="btnOpenModal" tabindex="0" title="Opciones">
        <aside class="letter">☰</aside>
      </article>
    </div>
    <h3>Equipos registrados</h3>
    <div class="equipos-scroll" id="equiposScroll"></div>
  </div>
  
  <script type="module" src="main.js"></script>
  <a class="add-btn" id="btnAddItem" title="Agregar equipo">
    <svg
      viewBox="0 0 256 256"
      height="32"
      width="38"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M74.34 85.66a8 8 0 0 1 11.32-11.32L120 108.69V24a8 8 0 0 1 16 0v84.69l34.34-34.35a8 8 0 0 1 11.32 11.32l-48 48a8 8 0 0 1-11.32 0ZM240 136v64a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16v-64a16 16 0 0 1 16-16h52.4a4 4 0 0 1 2.83 1.17L111 145a24 24 0 0 0 34 0l23.8-23.8a4 4 0 0 1 2.8-1.2H224a16 16 0 0 1 16 16m-40 32a12 12 0 1 0-12 12a12 12 0 0 0 12-12"
        fill="currentColor"
      ></path>
    </svg>
  </a>
</body>

<div class="modal-container" id="modalContainer">
  <div class="modal">
    <div class="modal-header">
      <h3>Opciones de usuario</h3>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>
    <div class="modal-body">
      <button type="button" class="modal-option" id="btnProfile">Mi perfil</button>
      <button type="button" class="modal-option" id="btnSettings">Configuración</button>
      <button type="button" class="modal-option" id="btnHelp">Ayuda</button>
      <button type="button" class="modal-option logout-btn" id="btnLogout">Cerrar sesión</button>
    </div>
  </div>
</div>
<div class="modal-container" id="modalAddItem">
  <div class="modal">
    <div class="modal-header">
      <h3>Agregar nuevo equipo</h3>
      <button class="close-btn" id="closeAddItemModal">&times;</button>
    </div>
    <div class="modal-body">
      <form id="formAddItem">
        <label for="tipo">Tipo de equipo:</label>
        <select id="tipo" required>
          <option>Laptop</option>
          <option>PC armada</option>
          <option>PC marca</option>
          <option>Impresora</option>
          <option>Tablet</option>
        </select>
        <input id="marca" placeholder="Marca" required>
        <input id="modelo" placeholder="Modelo" required>
        <input id="color" placeholder="Color" required>
        <input id="contrasena" placeholder="Contraseña (si aplica)">
        <input id="condiciones" placeholder="Condiciones del equipo (físicas)">
        <input id="problema" placeholder="Problema principal o motivo de ingreso" required>
        <button type="submit">Agregar equipo</button>
      </form>
    </div>
  </div>
</div>

</html>
