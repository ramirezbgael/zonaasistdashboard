<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Dashboard CUTinterno</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #0f0f0f;
      color: #eee;
      font-family: monospace;
      padding: 2rem;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    input,
    select,
    button {
      display: block;
      margin: 0.5rem 0;
      padding: 0.5rem;
      width: 100%;
      background: #1a1a1a;
      color: #eee;
      border: 1px solid #333;
      border-radius: 4px;
    }

    button {
      cursor: pointer;
      background: #333;
      color: #0f0;
      border-color: #0f0;
    }

    ul {
      padding-left: 1rem;
    }

    li {
      margin-bottom: 0.5rem;
    }

    li ul {
      margin-top: 0.25rem;
      padding-left: 1.5rem;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>👨‍💻 Dashboard CUTinterno</h2>
    <button id="btnLogout">Cerrar sesión</button>

    <h3>Equipos registrados</h3>
    <ul id="equipos"></ul>

    <h3>Agregar nuevo equipo</h3>
    <form id="formEquipo">
      <label for="tipo">Tipo de equipo:</label>
      <select id="tipo">
        <option>Laptop</option>
        <option>PC armada</option>
        <option>PC marca</option>
        <option>Impresora</option>
        <option>Tablet</option>
      </select>

      <input id="marca" placeholder="Marca" required>
      <input id="modelo" placeholder="Modelo" required>
      <input id="color" placeholder="Color" required>
      <input id="contrasena" placeholder="Contraseña (si aplica)">
      <input id="condiciones" placeholder="Condiciones del equipo (físicas)">
      <input id="problema" placeholder="Problema principal o motivo de ingreso" required>

      <button type="submit">Agregar equipo</button>
    </form>

    <h3>Agregar pendiente a un equipo</h3>
    <select id="selEquipo"></select>
    <input id="desc" placeholder="Descripción del pendiente">
    <button id="btnAdd">Agregar pendiente</button>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
