[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  # Omitir variables VITE_ del escaneo de secretos (son públicas y deben estar en el cliente)
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Variables de entorno necesarias (configurar en Netlify Dashboard)
# VITE_SUPABASE_URL = tu_url_de_supabase
# SUPABASE_SERVICE_ROLE_KEY = tu_service_role_key
# EVOLUTION_API_URL = http://localhost:8080 (o tu URL de Evolution API)
# EVOLUTION_API_KEY = tu_api_key_de_evolution
# EVOLUTION_INSTANCE_NAME = zona-asist (opcional, por defecto)

# Configuración para funciones serverless (si las necesitas en el futuro)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

